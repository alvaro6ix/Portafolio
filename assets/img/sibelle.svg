<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sibelle Psicología - Vista previa del sitio web">
  <defs>
    <!-- Soft cream gradient background like the real site -->
    <linearGradient id="sb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6ef"/>
      <stop offset="55%" stop-color="#f1ebde"/>
      <stop offset="100%" stop-color="#e4dbc5"/>
    </linearGradient>
    <!-- Sage / forest accent gradient for buttons & accents -->
    <linearGradient id="sb-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a9978"/>
      <stop offset="100%" stop-color="#536b53"/>
    </linearGradient>
    <linearGradient id="sb-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f2e6"/>
    </linearGradient>
    <linearGradient id="sb-photo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9b896"/>
      <stop offset="100%" stop-color="#8a7355"/>
    </linearGradient>
    <radialGradient id="sb-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#bcd0a9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bcd0a9" stop-opacity="0"/>
    </radialGradient>
    <filter id="sb-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" in="SourceAlpha"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="800" height="600" fill="url(#sb-bg)"/>
  <!-- Soft glow behind hero -->
  <ellipse cx="400" cy="240" rx="380" ry="200" fill="url(#sb-glow)"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="54" fill="#ffffff" opacity="0.92"/>
  <line x1="0" y1="54" x2="800" y2="54" stroke="#d9cfb8" stroke-width="1"/>

  <!-- Logo "Sibe" -->
  <g transform="translate(36, 22)">
    <circle cx="0" cy="9" r="14" fill="url(#sb-accent)"/>
    <text x="-5" y="14" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#fff">S</text>
    <text x="22" y="20" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#3d4d3a">Sibe</text>
  </g>

  <!-- Nav items -->
  <g font-family="-apple-system, sans-serif" font-size="13" fill="#5a6b58">
    <text x="488" y="34">Inicio</text>
    <text x="544" y="34">Servicios</text>
    <text x="616" y="34">Nosotros</text>
    <text x="688" y="34">Contacto</text>
  </g>
  <!-- Active nav indicator -->
  <rect x="486" y="42" width="32" height="2" rx="1" fill="url(#sb-accent)"/>

  <!-- Hero pre-title pill -->
  <g transform="translate(280, 90)">
    <rect x="0" y="0" width="240" height="26" rx="13" fill="#ffffff" stroke="#c4b89b" stroke-width="1"/>
    <circle cx="20" cy="13" r="4" fill="#7a9978"/>
    <text x="32" y="17" font-family="-apple-system, sans-serif" font-size="11" letter-spacing="2" fill="#5a6b58">PSICOLOGÍA  ·  TUTORÍAS</text>
  </g>

  <!-- Hero title -->
  <text x="400" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#2c2419">Sibelle Psicología</text>

  <!-- Hero tagline -->
  <text x="400" y="195" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#5a6b58">"Transformando Mentes, Construyendo Futuros"</text>

  <!-- Author tag -->
  <text x="400" y="220" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" letter-spacing="3" fill="#8a7d62">— EVELYN SIBELLE LUNA ZAMORA</text>

  <!-- CTA Button -->
  <g transform="translate(335, 240)" filter="url(#sb-shadow)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="url(#sb-accent)"/>
    <text x="65" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#fff">Agendar cita →</text>
  </g>

  <!-- Service cards row -->
  <g transform="translate(110, 320)">
    <!-- Card 1: Terapia -->
    <g filter="url(#sb-shadow)">
      <rect x="0" y="0" width="270" height="220" rx="14" fill="url(#sb-card)" stroke="#e0d6bc" stroke-width="1"/>
    </g>
    <!-- Brain/Mind icon -->
    <g transform="translate(40, 36)">
      <circle cx="20" cy="20" r="26" fill="#eef2e6" stroke="#a8bea3" stroke-width="1.5"/>
      <path d="M 8 22 Q 8 10 20 10 Q 32 10 32 22 Q 32 34 20 34 Q 8 34 8 22 M 14 18 Q 17 14 20 14 M 26 18 Q 23 14 20 14 M 14 26 Q 17 30 20 30 M 26 26 Q 23 30 20 30" fill="none" stroke="#536b53" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="16" cy="19" r="1.5" fill="#536b53"/>
      <circle cx="24" cy="19" r="1.5" fill="#536b53"/>
    </g>
    <text x="135" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#2c2419">Terapia Psicológica</text>
    <text x="135" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#5a6b58">Sesiones individuales online</text>
    <text x="135" y="108" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#5a6b58">y presenciales para adultos</text>
    <text x="135" y="126" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#5a6b58">y adolescentes.</text>

    <line x1="40" y1="150" x2="230" y2="150" stroke="#e0d6bc" stroke-width="1"/>

    <g transform="translate(0, 165)">
      <circle cx="20" cy="20" r="3" fill="#7a9978"/>
      <text x="34" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#5a6b58">Ansiedad y depresión</text>
      <circle cx="150" cy="20" r="3" fill="#7a9978"/>
      <text x="164" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#5a6b58">Autoestima</text>
    </g>
    <g transform="translate(0, 188)">
      <circle cx="20" cy="20" r="3" fill="#7a9978"/>
      <text x="34" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#5a6b58">Duelo y trauma</text>
      <circle cx="150" cy="20" r="3" fill="#7a9978"/>
      <text x="164" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#5a6b58">Pareja</text>
    </g>
  </g>

  <g transform="translate(420, 320)">
    <!-- Card 2: Regularización -->
    <g filter="url(#sb-shadow)">
      <rect x="0" y="0" width="270" height="220" rx="14" fill="url(#sb-card)" stroke="#e0d6bc" stroke-width="1"/>
    </g>
    <!-- Book / Education icon -->
    <g transform="translate(40, 36)">
      <circle cx="20" cy="20" r="26" fill="#eef2e6" stroke="#a8bea3" stroke-width="1.5"/>
      <rect x="10" y="12" width="20" height="16" rx="1.5" fill="none" stroke="#536b53" stroke-width="1.6"/>
      <line x1="20" y1="12" x2="20" y2="28" stroke="#536b53" stroke-width="1.4"/>
      <line x1="13" y1="17" x2="17" y2="17" stroke="#536b53" stroke-width="1"/>
      <line x1="13" y1="22" x2="17" y2="22" stroke="#536b53" stroke-width="1"/>
      <line x1="23" y1="17" x2="27" y2="17" stroke="#536b53" stroke-width="1"/>
      <line x1="23" y1="22" x2="27" y2="22" stroke="#536b53" stroke-width="1"/>
    </g>
    <text x="135" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#2c2419">Regularización</text>
    <text x="135" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#5a6b58">Clases académicas y</text>
    <text x="135" y="108" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#5a6b58">acompañamiento escolar</text>
    <text x="135" y="126" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#5a6b58">para nivel primaria.</text>

    <line x1="40" y1="150" x2="230" y2="150" stroke="#e0d6bc" stroke-width="1"/>

    <g transform="translate(0, 165)">
      <circle cx="20" cy="20" r="3" fill="#7a9978"/>
      <text x="34" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#5a6b58">Matemáticas</text>
      <circle cx="150" cy="20" r="3" fill="#7a9978"/>
      <text x="164" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#5a6b58">Español / Lectura</text>
    </g>
    <g transform="translate(0, 188)">
      <circle cx="20" cy="20" r="3" fill="#7a9978"/>
      <text x="34" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#5a6b58">Ciencias naturales</text>
      <circle cx="150" cy="20" r="3" fill="#7a9978"/>
      <text x="164" y="24" font-family="-apple-system, sans-serif" font-size="10" fill="#5a6b58">Historia</text>
    </g>
  </g>

  <!-- Floating WhatsApp button (corner) -->
  <g transform="translate(740, 540)">
    <circle cx="0" cy="0" r="22" fill="#25d366" filter="url(#sb-shadow)"/>
    <path d="M -8 -2 Q -8 -10 0 -10 Q 8 -10 8 -2 Q 8 4 2 6 L 4 10 L -2 7 Q -8 5 -8 -2 Z" fill="#fff"/>
  </g>

  <!-- Subtle ornamental line -->
  <line x1="40" y1="568" x2="700" y2="568" stroke="#c4b89b" stroke-width="1" opacity="0.4"/>
  <text x="40" y="585" font-family="-apple-system, sans-serif" font-size="10" fill="#8a7d62">© Sibelle · Calimaya, Edo. México · Disponible online</text>
</svg>
